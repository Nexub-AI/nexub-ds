name: Feature request
description: Something Nexub should do that it doesn't. Requests with real demand become an RFC.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: "What are you building, and what gets in the way today?" }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What would help, description: "Optional: an API sketch, a screenshot, or how another library does it." }

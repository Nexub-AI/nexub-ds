name: Outside PRs

# Open source, not open contribution (CONTRIBUTING.md): close pull requests from
# outside the maintainer team with a pointer to the issue forms.
# pull_request_target runs in the base repo; it never checks out or runs PR code.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- no checkout, no PR code; only closes the PR
    types: [opened, reopened]

permissions: {}

jobs:
  close:
    # Outsiders can't push branches here, so their PRs always come from a fork.
    # Not author_association: members with private org membership show up as
    # CONTRIBUTOR in the event and got their own PRs closed (8.1, #508, #510).
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" --repo "$REPO" --comment "Thanks for taking the time! Nexub is open source but not open contribution: only maintainers write code (see CONTRIBUTING.md). Please open an issue with the matching form (https://github.com/$REPO/issues/new/choose) or start a Discussion, and we'll pick it up from there."

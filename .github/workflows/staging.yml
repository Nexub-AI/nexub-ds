name: Staging Deploy

# Triggered on every push to the development branch.
# 1. Builds all packages + the docs site locally to verify the build is green.
# 2. Triggers a new deployment on the DigitalOcean App Platform staging app.
#    DO clones the branch, runs its own build command, and publishes the URL.

on:
  push:
    branches: [development]

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true   # cancel queued runs; only the latest matters

jobs:
  staging:
    name: Build & deploy to staging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Verify the build passes before telling DO to deploy
      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Build docs
        run: pnpm turbo build --filter='@nexub/docs'

      # Trigger a new deployment on the DO staging app
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy to DigitalOcean staging
        run: |
          doctl apps create-deployment ${{ secrets.DO_STAGING_APP_ID }} \
            --wait \
            --no-color

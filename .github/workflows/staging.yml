name: Staging Deploy

# Triggered on every push to the staging branch.
# Builds all packages + docs (static export) then deploys to Cloudflare Pages
# staging environment. Preview URL: staging.nexub-ds-docs.pages.dev
#
# Flow: development → PR → staging (this workflow) → PR → production

on:
  push:
    branches: [staging]

concurrency:
  group: staging-deploy
  cancel-in-progress: true  # only the latest push to staging matters

jobs:
  deploy-staging:
    name: Build & deploy to Cloudflare Pages (staging)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write  # required so wrangler can register a GitHub Deployment for the Pages preview URL

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        # version is read from packageManager field in package.json (pnpm@10.34.7)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # turbo orders builds by the workspace dependency graph (tokens → icons → react → patterns).
      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      # Static export → apps/docs/out/
      # NEXT_PUBLIC_* values are baked into the JS bundle at build time, so we
      # must inject them HERE (in the GH Actions runner) — Cloudflare Pages
      # dashboard env vars only reach the Pages runtime, not the build.
      # The Turnstile *site* key is public by design (it lands in every page's
      # HTML), so it's stored as a repo Variable, not a Secret.
      - name: Build docs (static export)
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm --filter @nexub/docs build

      # Deploy to Cloudflare Pages under the "staging" branch alias.
      # This creates a preview URL: staging.nexub-ds-docs.pages.dev
      # Does NOT affect the production URL.
      #
      # Wrangler 3 expects two siblings at the cwd it runs from:
      #   - <deploy-dir>/        ← static files (here: out/)
      #   - functions/           ← Pages Functions source (sibling of out/)
      # That's why we cd into apps/docs first, then point wrangler at out/.
      # The Functions live at apps/docs/functions/ in source.
      - name: Deploy to Cloudflare Pages (staging)
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3.114.17 pages deploy out --project-name=nexub-ds-docs --branch=staging --commit-dirty=true

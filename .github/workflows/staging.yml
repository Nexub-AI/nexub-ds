name: Staging Deploy

# Triggered on every push to the staging branch.
# Builds all packages + docs (static export) then deploys to Cloudflare Pages
# staging environment. Preview URL: staging.nexub-ds-docs.pages.dev
#
# Flow: development → PR → staging (this workflow) → PR → production

on:
  push:
    branches: [staging]

concurrency:
  group: staging-deploy
  cancel-in-progress: true  # only the latest push to staging matters

jobs:
  deploy-staging:
    name: Build & deploy to Cloudflare Pages (staging)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write  # required so wrangler can register a GitHub Deployment for the Pages preview URL

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from packageManager field in package.json (pnpm@9.12.0)

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build packages in dependency order
      - name: Build @nexub/tokens
        run: pnpm --filter @nexub/tokens build

      - name: Build @nexub/icons
        run: pnpm --filter @nexub/icons build

      - name: Build @nexub/react
        run: pnpm --filter @nexub/react build

      - name: Build @nexub/patterns
        run: pnpm --filter @nexub/patterns build

      # Static export → apps/docs/out/
      - name: Build docs (static export)
        run: pnpm --filter @nexub/docs build

      # Deploy to Cloudflare Pages under the "staging" branch alias.
      # This creates a preview URL: staging.nexub-ds-docs.pages.dev
      # Does NOT affect the production URL.
      #
      # Wrangler 3 expects two siblings at the cwd it runs from:
      #   - <deploy-dir>/        ← static files (here: out/)
      #   - functions/           ← Pages Functions source (sibling of out/)
      # That's why we cd into apps/docs first, then point wrangler at out/.
      # The Functions live at apps/docs/functions/ in source.
      - name: Deploy to Cloudflare Pages (staging)
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages deploy out --project-name=nexub-ds-docs --branch=staging --commit-dirty=true

name: Security

# Static analysis (CodeQL: JS/TS and the workflows themselves) and OpenSSF
# Scorecard (repo supply-chain posture). Findings land in the repo's Security
# → Code scanning tab. zizmor and `pnpm audit` stay in ci.yml.
on:
  pull_request:
    branches: [development]
  push:
    branches: [development]
  schedule:
    - cron: '0 3 * * 1'  # Mondays, picks up new CodeQL queries and advisories

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode none: both languages are analysed from source, no build.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - 'apps/docs/out'

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  # 9.7 blocking gate: no open CodeQL alert of high or critical severity on this ref
  # (limit in security-gates.json). Runs after both analyses have uploaded.
  codeql-gate:
    name: CodeQL gate (0 high)
    needs: codeql
    # Fork and Dependabot PRs get a token that can't read alerts; the push run covers them.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # GitHub processes the uploaded results for a moment before the alerts change.
      - name: No open high or critical CodeQL alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: sleep 45 && node scripts/security-gates.mjs codeql

  scorecard:
    name: OpenSSF Scorecard
    # Scorecard reads branch protection and repo settings of the default
    # branch, so it doesn't run on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard

      # 9.7 blocking gate: the aggregate score (JSON run of the same checks) must be at
      # least scorecardMin in security-gates.json, a ratchet toward 8. The step summary
      # lists every check below 10 with its reason.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Scorecard gate
        run: node scripts/security-gates.mjs scorecard scorecard.json

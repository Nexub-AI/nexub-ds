name: Release

# Triggered on every push to production.
#
# Two-phase behaviour via changesets/action:
#   Phase A — no pending changesets: nothing to publish, just deploys docs.
#   Phase B — pending changesets exist:
#     1. Opens/updates a "Version Packages" PR against production.
#     2. When THAT PR is merged → publishes all @nexub/* packages to npm.
#     3. Deploys docs to Cloudflare Pages production.
#
# Flow: development → staging → PR → production (this workflow)

on:
  push:
    branches: [production]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Publish to npm & deploy docs
    runs-on: ubuntu-latest

    permissions:
      contents: write       # changesets needs to push version commits
      pull-requests: write  # changesets opens the Version Packages PR
      deployments: write    # required so wrangler can register a GitHub Deployment for the Pages production URL

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # changesets needs full history to detect changes
          # Check out with the PAT so the Version Packages PR (and its branch)
          # is created by a real user — the org forbids the Actions bot from
          # creating or approving pull requests.
          token: ${{ secrets.RELEASE_PAT }}

      - uses: pnpm/action-setup@v4
        # version is read from packageManager field in package.json (pnpm@9.12.0)

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build packages in dependency order (required before publish)
      - name: Build @nexub/tokens
        run: pnpm --filter @nexub/tokens build

      - name: Build @nexub/icons
        run: pnpm --filter @nexub/icons build

      - name: Build @nexub/react
        run: pnpm --filter @nexub/react build

      - name: Build @nexub/patterns
        run: pnpm --filter @nexub/patterns build

      # changesets/action:
      #   - If .changeset/*.md files exist → opens/updates "Version Packages" PR
      #   - If already versioned (PR was merged) → runs `pnpm release` to publish
      - name: Create Release PR or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          # Use a PAT, not the default GITHUB_TOKEN: the org blocks the Actions
          # bot from creating/approving PRs, which breaks the "Version Packages"
          # PR step. RELEASE_PAT must be a repo secret — a fine-grained PAT with
          # Contents: write + Pull requests: write (or a classic token with the
          # `repo` scope). Falls back to GITHUB_TOKEN only for the publish phase.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Build docs static export (always, not just on publish)
      # We deploy on every production push so the site always matches the code.
      # NEXT_PUBLIC_* values are baked into the JS bundle at build time, so we
      # must inject them HERE (in the GH Actions runner) — Cloudflare Pages
      # dashboard env vars only reach the Pages runtime, not the build.
      # The Turnstile *site* key is public by design (it lands in every page's
      # HTML), so it's stored as a repo Variable, not a Secret.
      - name: Build docs (static export)
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm --filter @nexub/docs build

      # Deploy to Cloudflare Pages production.
      # The production alias maps to your custom domain (e.g. docs.nexub.com).
      #
      # Wrangler 3 expects two siblings at the cwd it runs from:
      #   - <deploy-dir>/        ← static files (here: out/)
      #   - functions/           ← Pages Functions source (sibling of out/)
      # That's why we cd into apps/docs first, then point wrangler at out/.
      # The Functions live at apps/docs/functions/ in source.
      - name: Deploy to Cloudflare Pages (production)
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3.114.17 pages deploy out --project-name=nexub-ds-docs --branch=production --commit-dirty=true

name: Release

# Triggered on every push to production.
#
# Two-phase behaviour via changesets/action:
#   Phase A — pending changesets: opens/updates the "Version Packages" PR.
#   Phase B — none pending (that PR was merged): publishes every unpublished
#             @nexub/* package to npm, then opens the back-merge PR.
#   Docs deploy to Cloudflare Pages production on every push.
#
# Flow: development → staging → PR → production (this workflow)
#
# One credential per job (7.1). Building runs third-party code (every dev
# dependency, Next, turbo), so it happens in `build`, which holds no secrets.
# The jobs that hold a credential install with scripts off and run only the
# tool they need:
#   build        no secrets         build packages + docs, pack and attest the tarballs (build-release.yml)
#   version      RELEASE_PAT        Version Packages PR (phase A)
#   publish      npm OIDC           publish those exact tarballs, tags, releases, SBOM (phase B)
#   back-merge   RELEASE_PAT        production → development PR (after a publish)
#   deploy-docs  Cloudflare token   deploy the built docs
# RELEASE_PAT and the Cloudflare secrets live in the `release` environment
# (deployment branch: production only), so PR workflows can't read them.

on:
  push:
    branches: [production]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  # The build lives in a reusable workflow (build-release.yml): isolated from this file's
  # other jobs, it packs the tarballs and signs their SLSA build provenance (9.7).
  build:
    name: Build packages and docs
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: $/.github/workflows/build-release.yml
    with:
      attest: true

  version:
    name: Version Packages PR
    needs: build
    if: needs.build.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # changesets needs full history to detect changes
          persist-credentials: false  # changesets/action writes its own ~/.netrc

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Scripts off: nothing here needs a native build, and none should run
      # where the PAT is.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create or update the Version Packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # `changeset version` + minor rollover (1.9.x → 2.0.0), see PUBLISHING.md.
          version: pnpm version-packages
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          # A PAT, not GITHUB_TOKEN: the org blocks the Actions bot from
          # creating PRs. Fine-grained, Contents + Pull requests: write.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  publish:
    name: Publish to npm
    needs: build
    if: needs.build.outputs.has_changesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # git tags + GitHub releases (job token, no PAT)
      id-token: write   # npm trusted publishing (OIDC): short-lived token + provenance
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false  # changesets/action writes its own ~/.netrc

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm 11 (>= 11.5.1), which trusted publishing needs;
          # `pnpm publish` hands the upload to this npm CLI.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Scripts off: any step in this job can mint an npm OIDC token.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Publish exactly what `build` produced and attested; nothing is built or packed here.
      - name: Download tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs

      # publish-tarballs.mjs checks every tarball against checksums.txt, uploads the ones
      # not yet on npm with `npm publish <file>`, then runs `changeset tag`, whose
      # "New tag:" lines this action turns into GitHub releases.
      - name: Publish unpublished packages
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: node scripts/publish-tarballs.mjs tarballs
        env:
          # Tags and GitHub releases only; npm auth is OIDC (every @nexub
          # package trusts Nexub-AI/nexub-ds release.yml on npmjs.com).
          GITHUB_TOKEN: ${{ github.token }}

      - name: Read released version
        id: version
        if: steps.changesets.outputs.published == 'true'
        run: echo "version=$(node -p "require('./packages/react/package.json').version")" >> "$GITHUB_OUTPUT"

      # GitHub's dependency-graph SBOM (SPDX) for the released commit, attached
      # to the @nexub/react release (all packages release in lockstep).
      - name: Attach SBOM to the release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq .sbom > "nexub-${VERSION}.spdx.json"
          gh release upload "@nexub/react@${VERSION}" "nexub-${VERSION}.spdx.json" --clobber

      # The tarballs, their checksums and the signed provenance bundle, on the release.
      - name: Attach tarballs and provenance to the release
        if: ${{ !cancelled() && steps.changesets.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "@nexub/react@${VERSION}" tarballs/*.tgz tarballs/checksums.txt tarballs/*.intoto.jsonl --clobber

      # What npm serves must be the attested artifact: download each published tarball
      # and verify its provenance against this repository and build-release.yml.
      # Blocking since 9.8 (it passed on 9.7.0): a red release run is the alarm.
      - name: Verify provenance of the published tarballs
        if: ${{ !cancelled() && steps.changesets.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          mkdir -p from-npm && cd from-npm
          sleep 90  # registry lag
          for spec in $(node -e 'for (const p of JSON.parse(process.env.PUBLISHED_PACKAGES)) console.log(`${p.name}@${p.version}`)'); do
            file=$(npm pack "$spec" --silent)
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build-release.yml"
          done

      # A signed tag for the release as a whole (vX.Y.Z), next to the per-package tags
      # changesets makes. Signed with Sigstore (gitsign): no key to keep, the signature is
      # tied to this workflow run and logged in Rekor. Verify with:
      #   gitsign verify-tag --certificate-identity-regexp '.*/release.yml@refs/heads/production' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com vX.Y.Z
      # Blocking since 9.8. The packages are already on npm when this runs, so a failure
      # doesn't undo the release: it turns the run red, and the tag is then signed by hand
      # (INCIDENT_RUNBOOK.md, "A release step failed").
      - name: Set up gitsign
        if: ${{ !cancelled() && steps.changesets.outputs.published == 'true' }}
        uses: chainguard-dev/actions/setup-gitsign@a25ce483d875a46f4c837e85e32e0fda602693f5 # v1.8.1

      - name: Signed release tag
        if: ${{ !cancelled() && steps.changesets.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/signed-tag.sh "v${VERSION}" --push

      # Every version changesets published must be on the registry with an npm
      # provenance attestation. The registry lags 1–2 minutes, so the script
      # retries for up to 10 minutes, then fails naming each missing or
      # unattested package. `!cancelled()` keeps it running if the SBOM step failed.
      - name: Verify published versions and provenance on npm
        if: ${{ !cancelled() && steps.changesets.outputs.published == 'true' }}
        timeout-minutes: 13
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: node scripts/verify-published.mjs

  # After a publish, the version commit (bumped package.json + CHANGELOGs)
  # only exists on production. Open a PR merging it back into development so
  # the next promotion doesn't conflict on the version lines. No checkout:
  # no repository code runs next to the PAT.
  back-merge:
    name: Open back-merge PR
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Open back-merge PR (production → development)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base development --head production --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base development --head production \
              --title "chore(release): back-merge v$VERSION into development" \
              --body "Brings the v$VERSION version bump and CHANGELOGs back into development. Merge before the next promotion."
          fi

  # Deploy to Cloudflare Pages production on every push, so the site always
  # matches the code. The production alias maps to the custom domain.
  deploy-docs:
    name: Deploy docs
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read  # wrangler gets only the Cloudflare token, never GITHUB_TOKEN
    steps:
      # Checkout for apps/docs/functions (Pages Functions source) and the lockfile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # wrangler is pinned in apps/docs devDependencies (lockfile), not npx.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download built docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-out
          path: apps/docs/out

      # Wrangler 3 expects out/ (static files) and functions/ as siblings of
      # the cwd, hence apps/docs.
      - name: Deploy to Cloudflare Pages (production)
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy out --project-name=nexub-ds-docs --branch=production --commit-dirty=true

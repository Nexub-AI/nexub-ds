name: Release

# Triggered on every push to main.
# changesets/action will either:
#   (a) open/update a "Version Packages" PR, or
#   (b) when that PR is merged, publish all packages to npm.
# After a successful publish we trigger a new deployment on the
# DigitalOcean App Platform production app.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Create "Version Packages" PR or publish to npm
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Only deploy docs to production when packages were actually published
      # (not when a Version PR was merely created or updated)
      - name: Install doctl
        if: steps.changesets.outputs.published == 'true'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy docs to DigitalOcean production
        if: steps.changesets.outputs.published == 'true'
        run: |
          doctl apps create-deployment ${{ secrets.DO_PRODUCTION_APP_ID }} \
            --wait \
            --no-color

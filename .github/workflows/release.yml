name: Release

# Triggered on every push to production.
#
# Two-phase behaviour via changesets/action:
#   Phase A — no pending changesets: nothing to publish, just deploys docs.
#   Phase B — pending changesets exist:
#     1. Opens/updates a "Version Packages" PR against production.
#     2. When THAT PR is merged → publishes all @nexub/* packages to npm.
#     3. Deploys docs to Cloudflare Pages production.
#
# Flow: development → staging → PR → production (this workflow)

on:
  push:
    branches: [production]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Publish to npm & deploy docs
    runs-on: ubuntu-latest

    permissions:
      contents: write       # changesets needs to push version commits
      pull-requests: write  # changesets opens the Version Packages PR
      deployments: write    # cloudflare/wrangler-action needs this to create GitHub Deployments

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # changesets needs full history to detect changes

      - uses: pnpm/action-setup@v4
        # version is read from packageManager field in package.json (pnpm@9.12.0)

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build packages in dependency order (required before publish)
      - name: Build @nexub/tokens
        run: pnpm --filter @nexub/tokens build

      - name: Build @nexub/icons
        run: pnpm --filter @nexub/icons build

      - name: Build @nexub/react
        run: pnpm --filter @nexub/react build

      - name: Build @nexub/patterns
        run: pnpm --filter @nexub/patterns build

      # changesets/action:
      #   - If .changeset/*.md files exist → opens/updates "Version Packages" PR
      #   - If already versioned (PR was merged) → runs `pnpm release` to publish
      - name: Create Release PR or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Build docs static export (always, not just on publish)
      # We deploy on every production push so the site always matches the code.
      - name: Build docs (static export)
        run: pnpm --filter @nexub/docs build

      # Deploy to Cloudflare Pages production.
      # The production alias maps to your custom domain (e.g. docs.nexub.com).
      #
      # We use cloudflare/wrangler-action@v3 (latest wrangler) instead of the
      # deprecated cloudflare/pages-action@v1 — the older action ships
      # wrangler@2 which does not upload Pages Functions properly. See
      # apps/docs/pages-functions/ for the Function source.
      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/docs/out --project-name=nexub-ds-docs --branch=production --commit-dirty=true

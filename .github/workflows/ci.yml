name: CI

# Runs on direct pushes to development and on PRs targeting development/staging/production.
# staging/production are excluded from push triggers — their own deploy workflows
# already build everything post-merge, so a second CI run would be redundant.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development, staging, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub-hosted runners: Actions minutes are free for public repos, and
  # fork PRs never run on the office Mac minis (their runner group blocks
  # public repos on purpose).
  ci:
    name: Build, typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # version is read from packageManager field in package.json (pnpm@10.34.7)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on known high/critical advisories in any dependency, dev tools included (9.8).
      # The only exceptions are pnpm.auditConfig.ignoreGhsas in package.json, explained in SECURITY.md.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # Static security lint for the workflows themselves (injection, unpinned actions, token scope).
      - name: Workflow lint (zizmor)
        run: pipx run zizmor==1.30.1 --offline .github/workflows

      # turbo orders builds by the workspace dependency graph (tokens → icons → react → patterns).
      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      # gzip budgets per entry point (size-budgets.json). They only go down: `pnpm check:size
      # --update` ratchets them to current size. A raise is a hand edit, explained in the PR
      # under "## Budget raises" (checked on feature PRs into development).
      - name: Base budgets
        if: github.event_name == 'pull_request' && github.base_ref == 'development'
        run: git fetch --depth=1 origin development && git show FETCH_HEAD:size-budgets.json > "$RUNNER_TEMP/base-budgets.json"
      - name: Bundle size
        run: pnpm check:size
        env:
          SIZE_BASE_BUDGETS: ${{ runner.temp }}/base-budgets.json
          PR_BODY: ${{ github.event.pull_request.body }}

      # Docs static export — verifies all pages pre-render without errors.
      # Output goes to apps/docs/out/ (deployed by Cloudflare Pages jobs).
      - name: Build docs (static export)
        run: pnpm --filter @nexub/docs build
      # Every same-site link and #fragment in the export resolves (8.8).
      - name: Docs links
        run: node apps/docs/scripts/check-links.mjs

      # Versioning policy: changesets may only be minor/patch (PUBLISHING.md).
      - name: Release policy
        run: pnpm check:release-policy

      # The Claude skill, llms.txt and @nexub/mcp are generated from the docs
      # registry + tokens; fail if a component/token change forgot `pnpm ai-docs`.
      - name: AI docs up to date
        run: pnpm ai-docs --check

      # The docs' props tables (React Native and web) are generated from source.
      - name: Native props up to date
        run: node apps/docs/scripts/native-props.mjs --check
      - name: Web props up to date
        run: node apps/docs/scripts/web-props.mjs --check
      # Web ↔ native prop parity matrix (8.5): drift on either platform shows up as a diff.
      - name: Parity matrix up to date
        run: node apps/docs/scripts/parity.mjs --check
      # Every TSX/TS code sample in the docs typechecks against the built packages (8.4).
      - name: Docs code samples typecheck
        run: node apps/docs/scripts/check-samples.mjs

      - name: Typecheck all packages
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Test
        run: pnpm turbo test

      - name: Build Storybook
        run: pnpm --filter @nexub/react build-storybook --quiet

  # Screenshot every story (light/dark/payub), the docs foundation pages (light/dark)
  # + WCAG contrast over theme tokens.
  # Runs in the same pinned Playwright image used to record baselines locally
  # (`pnpm --filter @nexub/react test:visual:docker --update-snapshots`), so
  # font rendering matches pixel for pixel.
  visual:
    name: Visual regression & contrast
    # Skip on promotion, Version Packages and back-merge PRs: they carry code that
    # already passed this job on development (push), so it only slowed releases.
    if: github.event_name == 'push' || (github.base_ref == 'development' && github.head_ref != 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Build Storybook
        run: pnpm --filter @nexub/react build-storybook --quiet

      # Static export for the docs foundation-page screenshots (project "docs").
      - name: Build docs (static export)
        run: pnpm --filter @nexub/docs build

      - name: Visual regression & contrast
        run: pnpm --filter @nexub/react test:visual --project=storybook --project=perf --project=docs

      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: |
            packages/react/playwright-report
            packages/react/test-results
          retention-days: 7

  # 9.7: every PR rehearses the release. `release-build` is the same reusable workflow
  # release.yml publishes from (attestation and docs off). `release-rehearsal` then checks
  # what a release depends on: the dependency policy, the tarballs against their checksums
  # (publish dry run), that a second build on this machine gives byte-identical tarballs,
  # and that a tag can be signed and verified with Sigstore.
  release-build:
    name: Release build
    # Also on the Version Packages PR: its versions are not on npm yet, so that is the one
    # place the publish dry run really calls `npm publish` (elsewhere it skips them all).
    if: github.event_name == 'push' || (github.base_ref == 'development' && github.head_ref != 'production') || github.head_ref == 'changeset-release/production'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: $/.github/workflows/build-release.yml
    with:
      attest: false
      docs: false

  release-rehearsal:
    name: Release rehearsal
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # Sigstore identity for the rehearsal tag (never pushed)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency policy (lockfile, runtime dependencies, package age)
        run: node scripts/check-supply-chain.mjs

      - name: Download the release build's tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs

      - name: Publish (dry run)
        run: node scripts/publish-tarballs.mjs tarballs --dry-run

      - name: Reproducible build (second build, other machine)
        run: node scripts/reproducible-build.mjs --against tarballs/checksums.txt

      # Needs an OIDC token, which fork and Dependabot PRs don't get.
      - name: Set up gitsign
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: chainguard-dev/actions/setup-gitsign@a25ce483d875a46f4c837e85e32e0fda602693f5 # v1.8.1

      - name: Sign and verify a tag (not pushed)
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        run: sh scripts/signed-tag.sh "rehearsal-${GITHUB_SHA}"

  # 9.5: leaks and a short soak. Every story is mounted and unmounted 1,000 times (listeners,
  # timers, DOM nodes and heap must not grow), then one docs session runs for a minute
  # (soak.spec.ts; the 30-minute run is nightly, soak.yml).
  resilience:
    name: Resilience (leaks & soak)
    if: github.event_name == 'push' || (github.base_ref == 'development' && github.head_ref != 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    env:
      HOME: /root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Leak test (1,000 mounts per story)
        run: pnpm --filter @nexub/react test:leaks

      - name: Build docs (static export)
        run: pnpm --filter @nexub/docs build

      - name: Soak (docs, 1 min)
        run: pnpm --filter @nexub/react test:visual --project=soak

  # 9.1: the same Storybook and docs export in WebKit (Safari stand-in) and Firefox:
  # every story renders, the interaction states and docs pages match per-engine baselines.
  browsers:
    name: Browsers (${{ matrix.engine }})
    if: github.event_name == 'push' || (github.base_ref == 'development' && github.head_ref != 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Build Storybook
        run: pnpm --filter @nexub/react build-storybook --quiet

      - name: Build docs (static export)
        run: pnpm --filter @nexub/docs build

      - name: ${{ matrix.engine }}
        # Firefox refuses to start when $HOME isn't owned by the container user.
        env:
          HOME: /root
        run: pnpm --filter @nexub/react test:visual --project=${{ matrix.engine }} --project=docs-${{ matrix.engine }}

      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browsers-report-${{ matrix.engine }}
          path: |
            packages/react/playwright-report
            packages/react/test-results
          retention-days: 7

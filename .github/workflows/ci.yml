name: CI

# Runs on direct pushes to development and on PRs targeting development/staging/production.
# staging/production are excluded from push triggers — their own deploy workflows
# already build everything post-merge, so a second CI run would be redundant.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development, staging, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, typecheck & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # version is read from packageManager field in package.json (pnpm@10.34.7)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on known high/critical advisories in shipped (non-dev) dependencies.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      # Static security lint for the workflows themselves (injection, unpinned actions, token scope).
      - name: Workflow lint (zizmor)
        run: pipx run zizmor==1.30.1 --offline .github/workflows

      # turbo orders builds by the workspace dependency graph (tokens → icons → react → patterns).
      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      # Docs static export — verifies all pages pre-render without errors.
      # Output goes to apps/docs/out/ (deployed by Cloudflare Pages jobs).
      - name: Build docs (static export)
        run: pnpm --filter @nexub/docs build

      # Versioning policy: changesets may only be minor/patch (PUBLISHING.md).
      - name: Release policy
        run: pnpm check:release-policy

      - name: Typecheck all packages
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Test
        run: pnpm turbo test

      - name: Build Storybook
        run: pnpm --filter @nexub/react build-storybook --quiet

name: CI

# Runs on direct pushes to development and on PRs targeting development/staging/production.
# staging/production are excluded from push triggers — their own deploy workflows
# already build everything post-merge, so a second CI run would be redundant.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development, staging, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, typecheck & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # version is read from packageManager field in package.json (pnpm@10.34.7)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on known high/critical advisories in shipped (non-dev) dependencies.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      # Static security lint for the workflows themselves (injection, unpinned actions, token scope).
      - name: Workflow lint (zizmor)
        run: pipx run zizmor==1.30.1 --offline .github/workflows

      # turbo orders builds by the workspace dependency graph (tokens → icons → react → patterns).
      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      # gzip budgets per entry point (size-budgets.json). New entry or intended growth:
      # `pnpm check:size --update` and commit the reviewed diff.
      - name: Bundle size
        run: pnpm check:size

      # Docs static export — verifies all pages pre-render without errors.
      # Output goes to apps/docs/out/ (deployed by Cloudflare Pages jobs).
      - name: Build docs (static export)
        run: pnpm --filter @nexub/docs build

      # Versioning policy: changesets may only be minor/patch (PUBLISHING.md).
      - name: Release policy
        run: pnpm check:release-policy

      # The Claude skill, llms.txt and @nexub/mcp are generated from the docs
      # registry + tokens; fail if a component/token change forgot `pnpm ai-docs`.
      - name: AI docs up to date
        run: pnpm ai-docs --check

      - name: Typecheck all packages
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Test
        run: pnpm turbo test

      - name: Build Storybook
        run: pnpm --filter @nexub/react build-storybook --quiet

  # Screenshot every story (light/dark/payub), the docs foundation pages (light/dark)
  # + WCAG contrast over theme tokens.
  # Runs on the office Mac minis (self-hosted, org-level runners) to save
  # Actions minutes. Builds natively, then screenshots in the same pinned
  # Playwright Linux image used to record baselines locally
  # (`pnpm --filter @nexub/react test:visual:docker --update-snapshots`), so
  # font rendering matches pixel for pixel. Needs Docker (Colima) on the Mini.
  visual:
    name: Visual regression & contrast
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Build Storybook
        run: pnpm --filter @nexub/react build-storybook --quiet

      # Static export for the docs foundation-page screenshots (project "docs").
      - name: Build docs (static export)
        run: pnpm --filter @nexub/docs build

      - name: Check Docker
        # Colima belongs to the runner's user (ci-runner); start it after a reboot.
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          docker info >/dev/null 2>&1 || colima start
          docker info --format 'Docker {{.ServerVersion}}' || { echo "::error::Docker is not running for this runner's user. On the Mac mini, as ci-runner, run: colima start"; exit 1; }

      - name: Visual regression & contrast
        run: pnpm --filter @nexub/react test:visual:docker

      - name: Upload diff report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: |
            packages/react/playwright-report
            packages/react/test-results
          retention-days: 7

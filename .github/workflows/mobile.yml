name: Mobile

# Builds the Expo showcase (apps/mobile) as a release app and drives it with
# Maestro on an iOS simulator and an Android emulator. Runs only when the
# native packages, their inputs, or the app change.
#
# After merge to development only (not on PRs): the ~1 h simulators run while
# the release is promoted to staging, instead of blocking every feature PR and
# restarting on each push to it. The release script waits for this run to pass
# on the exact development commit before it merges staging -> production, so
# nothing reaches npm without it. workflow_dispatch runs it on any branch early.
#
# 9.5 soak: nightly (and on demand with the `soak` input) the iOS job builds the same app and,
# instead of the catalogue and preview flows, runs apps/mobile/scripts/soak.sh for 30 minutes:
# one session, no crash, flat memory. It does not gate releases.
on:
  workflow_dispatch:
    inputs:
      soak:
        description: 'Run the 30-minute iOS soak instead of the catalogue flows'
        type: boolean
        default: false
  schedule:
    - cron: '0 19 * * *' # 03:00 SGT
  push:
    branches: [development]
    paths:
      - 'packages/react-native/**'
      - 'packages/tokens/**'
      - 'packages/icons/**'
      - 'packages/core/**'
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 1
  EXPO_NO_TELEMETRY: 1
  MAESTRO_VERSION: 2.12.0
  MAESTRO_SHA256: a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e
  # The iOS XCTest driver can take minutes to start on shared macOS runners.
  MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
  MAESTRO_CLI_NO_ANALYTICS: 1
  SOAK: ${{ github.event_name == 'schedule' || inputs.soak == true }}

jobs:
  ios:
    name: iOS simulator (Maestro)
    # Skip the back-merge (head: production); it's already-tested code.
    if: github.head_ref != 'production'
    runs-on: macos-26
    # screenshot-gate.sh pushes recorded baselines to the PR branch with this
    # job's GITHUB_TOKEN. Never a PAT here: this job runs PR-branch scripts.
    permissions:
      contents: write
    # A passing run takes ~58 min (Release build 23–34, previews ~19), so 60
    # cancelled any slow runner.
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Path-independent hits, and room for a full React Native build.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
      CCACHE_FILECLONE: 'true'
      CCACHE_DEPEND: 'true'
      CCACHE_INODECACHE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      # ccache for the native compile (React Native + Expo modules), which is
      # most of the iOS job. USE_CCACHE=1 makes the generated Podfile route
      # clang through React Native's ccache wrappers. Each run saves a fresh
      # cache; later runs restore the newest one with the same lockfile, or
      # any older one, and only recompile what changed.
      - name: Install ccache
        run: brew install ccache

      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ios-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            ccache-ios-${{ hashFiles('pnpm-lock.yaml') }}-
            ccache-ios-

      - name: Generate the native project
        working-directory: apps/mobile
        env:
          USE_CCACHE: '1'
        run: pnpm exec expo prebuild --platform ios

      - name: Build the app (Release, simulator)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace NexubMobile.xcworkspace -scheme NexubMobile -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 40
          ccache --show-stats

      # Cached per version: the GitHub release download returned 504 on some runs.
      # A miss downloads with curl's retry (exponential backoff, covers 5xx); the
      # checksum is verified either way.
      - name: Cache Maestro
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: maestro.zip
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}-${{ env.MAESTRO_SHA256 }}

      - name: Install Maestro
        run: |
          [ -f maestro.zip ] || curl -fsSL --retry 6 --retry-all-errors --retry-max-time 600 -o maestro.zip \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | shasum -a 256 -c -
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Boot a simulator and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone 17')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" apps/mobile/ios/build/Build/Products/Release-iphonesimulator/NexubMobile.app
          # bootstatus -b covers the OS, not the app's first cold launch (dyld closure,
          # JS bundle), which raced Maestro's launchApp and its XCTest driver start and
          # crashed or timed out the first flow. Take that cold launch here, then quit.
          xcrun simctl launch "$UDID" ai.nexub.mobile
          i=0
          until xcrun simctl spawn "$UDID" launchctl list | grep -q 'UIKitApplication:ai.nexub.mobile'; do
            i=$((i + 1)); [ "$i" -ge 60 ] && { echo 'App did not start in 120 s'; exit 1; }
            sleep 2
          done
          sleep 10
          xcrun simctl terminate "$UDID" ai.nexub.mobile
          # Same status bar in every screenshot, so baselines don't drift on the clock.
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Maestro flows
        if: env.SOAK != 'true'
        run: maestro test apps/mobile/.maestro --test-output-dir maestro-out || { sh apps/mobile/scripts/maestro-failure.sh maestro-out; exit 1; }

      # One screenshot per docs preview example (<slug>--<example>--ios.png),
      # generated from apps/mobile/preview-manifest.json.
      - name: Maestro preview screenshots
        if: env.SOAK != 'true'
        run: maestro test apps/mobile/.maestro/previews --test-output-dir maestro-previews-out || { sh apps/mobile/scripts/maestro-failure.sh maestro-previews-out; exit 1; }

      # Compare the preview screenshots with apps/mobile/.maestro/baselines/ios
      # (or record them on a PR that has none; see screenshot-gate.sh).
      - name: Screenshot baselines
        if: env.SOAK != 'true'
        env:
          # PR branch, or the branch a manual run targets (to record new baselines before merge).
          HEAD_REF: ${{ github.head_ref || (github.event_name == 'workflow_dispatch' && github.ref_name) || '' }}
          PUSH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: sh apps/mobile/scripts/screenshot-gate.sh ios

      - name: Soak (30 min, one session)
        if: env.SOAK == 'true'
        run: sh apps/mobile/scripts/soak.sh || { sh apps/mobile/scripts/maestro-failure.sh maestro-soak-out; exit 1; }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-ios
          path: |
            maestro-out
            maestro-soak-out
            maestro-previews-out
            screenshot-diffs
            *.png
          retention-days: 14

  android:
    name: Android emulator (Maestro)
    # Skip the back-merge (head: production); it's already-tested code.
    # Not on soak runs: the soak is iOS only.
    if: github.head_ref != 'production' && github.event_name != 'schedule' && inputs.soak != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # See the iOS job: baselines are pushed with GITHUB_TOKEN, never a PAT.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Generate the native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android

      - name: Build the app (release APK, x86_64)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      # Cached per version: the GitHub release download returned 504 on some runs.
      # A miss downloads with curl's retry (exponential backoff, covers 5xx); the
      # checksum is verified either way.
      - name: Cache Maestro
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: maestro.zip
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}-${{ env.MAESTRO_SHA256 }}

      - name: Install Maestro
        run: |
          [ -f maestro.zip ] || curl -fsSL --retry 6 --retry-all-errors --retry-max-time 600 -o maestro.zip \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Maestro flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        # For screenshot-gate.sh (last line of the script): compare with
        # apps/mobile/.maestro/baselines/android, or record them on a PR.
        env:
          # PR branch, or the branch a manual run targets (to record new baselines before merge).
          HEAD_REF: ${{ github.head_ref || (github.event_name == 'workflow_dispatch' && github.ref_name) || '' }}
          PUSH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          # The defaults (2 cores, small RAM) took the emulator offline ~10 min
          # into the preview flow on several runs. The runner has 4 cores / 16 GB.
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          # android-ready.sh waits out adb flapping offline after boot and
          # install, and closes the launcher menu the runner's unlock keypress
          # can leave open. Both flows run in one Maestro invocation: adb also
          # drops when a run tears its driver down, which broke a second run.
          # android-demo-mode.sh pins the status bar for the screenshots.
          # android-settle.sh finishes the post-boot compile work up front.
          script: |
            sh apps/mobile/scripts/android-ready.sh
            sh apps/mobile/scripts/android-demo-mode.sh
            adb install apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            sh apps/mobile/scripts/android-settle.sh
            sh apps/mobile/scripts/android-ready.sh
            maestro test apps/mobile/.maestro/catalogue.yaml apps/mobile/.maestro/previews/previews.yaml --test-output-dir maestro-out || { sh apps/mobile/scripts/maestro-failure.sh maestro-out; sh apps/mobile/scripts/android-crash-log.sh; exit 1; }
            sh apps/mobile/scripts/screenshot-gate.sh android

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-android
          path: |
            maestro-out
            maestro-previews-out
            screenshot-diffs
            *.png
          retention-days: 14

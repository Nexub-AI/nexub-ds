# Smoke + screenshot of the Foundations screen (runs on iOS and Android in CI).
appId: ai.nexub.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Display"
    timeout: 60000
- takeScreenshot: foundations
- scrollUntilVisible:
    element: "Press me"
    direction: DOWN
- tapOn: "Press me"

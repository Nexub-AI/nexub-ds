# Walks every catalogue screen and screenshots it (iOS + Android in CI).
# Scroll to each target first: CI emulators have small screens.
# List rows are one accessible element ("Title, subtitle"), so match by prefix.
appId: ai.nexub.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Components"
    timeout: 60000
- takeScreenshot: 00-catalogue

- tapOn: "Foundations.*"
- extendedWaitUntil:
    visible: "Display"
    timeout: 10000
- scrollUntilVisible:
    element: "Press me"
- tapOn: "Press me"
- takeScreenshot: 01-foundations
- back

- tapOn: "Actions.*"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 10000
- scrollUntilVisible:
    element: "Bank"
- tapOn: "Bank"
- takeScreenshot: 02-actions
- back

- tapOn: "Inputs.*"
- extendedWaitUntil:
    visible: "You send"
    timeout: 10000
- scrollUntilVisible:
    element: "Month"
- tapOn: "Month"
- takeScreenshot: 03-inputs
- back

- scrollUntilVisible:
    element: "Lists & cards.*"
- tapOn: "Lists & cards.*"
- extendedWaitUntil:
    visible: "Total balance"
    timeout: 10000
- takeScreenshot: 04-lists
- back

- scrollUntilVisible:
    element: "Feedback.*"
- tapOn: "Feedback.*"
- extendedWaitUntil:
    visible: "Banners"
    timeout: 10000
- scrollUntilVisible:
    element: "Show toast"
- tapOn: "Show toast"
- assertVisible: "Recipient saved"
- takeScreenshot: 05-feedback
- tapOn: "Open dialog"
- assertVisible: "Cancel this transfer?"
- tapOn: "Keep it"
- assertNotVisible: "Cancel this transfer?"
- back

- scrollUntilVisible:
    element: "Mobile patterns.*"
- tapOn: "Mobile patterns.*"
- extendedWaitUntil:
    visible: "Sheets and menus"
    timeout: 10000
- tapOn: "Open sheet"
- assertVisible: "Transfer details"
- takeScreenshot: 06-sheet
- tapOn: "Confirm and send"
- assertNotVisible: "Transfer details"
- scrollUntilVisible:
    element: "Show Balance"
- tapOn: "Show Balance"
- assertVisible: "$12,480.50"
- takeScreenshot: 07-mobile
- back

- scrollUntilVisible:
    element: "Screens.*"
- tapOn: "Screens.*"
- extendedWaitUntil:
    visible: "Payub flows"
    timeout: 10000
- scrollUntilVisible:
    element: "Send money.*"
- tapOn: "Send money.*"
- extendedWaitUntil:
    visible: "How much?"
    timeout: 10000
- tapOn: "2"
- tapOn: "5"
- tapOn: "0"
- assertVisible: "Recipient gets"
- takeScreenshot: 08-send
- back
- scrollUntilVisible:
    element: "Activity.*"
- tapOn: "Activity.*"
- extendedWaitUntil:
    visible: "Amazon.*"
    timeout: 10000
- takeScreenshot: 09-activity

# Walks every catalogue screen and screenshots it (iOS + Android in CI).
# Scroll targets into view with subflows/scroll-to.yaml (centred on Android,
# where a row at the bottom edge sits under the gesture bar; not on iOS, where
# centring can park it under the translucent navigation bar). Taps retry if
# the screen didn't change (a tap that only stops scroll momentum on iOS).
# List rows are one accessible element ("Title, subtitle"), so match by prefix.
# Toasts, dialogs and sheets spring in, so wait for them rather than assert
# at the instant of the tap (iOS simulators run the animation; CI Android
# emulators have system animations off).
appId: ai.nexub.mobile
---
# CI installs a fresh build, so no clearState (it reinstalls on iOS and can hang).
- launchApp
- extendedWaitUntil:
    visible: "Components"
    timeout: 60000
- takeScreenshot: 00-catalogue

- tapOn:
    text: "Foundations.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Display"
    timeout: 10000
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Press me"
- tapOn:
    text: "Press me"
    retryTapIfNoChange: true
- takeScreenshot: 01-foundations
- runFlow: subflows/back.yaml

- tapOn:
    text: "Actions.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Continue"
    timeout: 10000
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Bank"
- tapOn:
    text: "Bank"
    retryTapIfNoChange: true
- takeScreenshot: 02-actions
- runFlow: subflows/back.yaml

- tapOn:
    text: "Inputs.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "You send"
    timeout: 10000
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Month"
- tapOn:
    text: "Month"
    retryTapIfNoChange: true
- takeScreenshot: 03-inputs
- runFlow: subflows/back.yaml

- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Lists & cards.*"
- tapOn:
    text: "Lists & cards.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Total balance"
    timeout: 10000
- takeScreenshot: 04-lists
- runFlow: subflows/back.yaml

- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Feedback.*"
- tapOn:
    text: "Feedback.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Banners"
    timeout: 10000
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Show toast"
- tapOn:
    text: "Show toast"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Recipient saved"
    timeout: 5000
- takeScreenshot: 05-feedback
- tapOn:
    text: "Open dialog"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Cancel this transfer?"
    timeout: 5000
- tapOn:
    text: "Keep it"
    retryTapIfNoChange: true
- assertNotVisible: "Cancel this transfer?"
- runFlow: subflows/back.yaml

- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Mobile patterns.*"
- tapOn:
    text: "Mobile patterns.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Sheets and menus"
    timeout: 10000
- tapOn:
    text: "Open sheet"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Transfer details"
    timeout: 5000
- takeScreenshot: 06-sheet
- tapOn:
    text: "Confirm and send"
    retryTapIfNoChange: true
- assertNotVisible: "Transfer details"
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Show Balance"
- tapOn:
    text: "Show Balance"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: ".*12,480.50"
    timeout: 5000
- takeScreenshot: 07-mobile
- runFlow: subflows/back.yaml

- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Screens.*"
- tapOn:
    text: "Screens.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Payub flows"
    timeout: 10000
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Send money.*"
- tapOn:
    text: "Send money.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "How much?"
    timeout: 10000
- tapOn:
    text: "2"
    retryTapIfNoChange: true
- tapOn:
    text: "5"
    retryTapIfNoChange: true
- tapOn:
    text: "0"
    retryTapIfNoChange: true
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Recipient gets.*"
- takeScreenshot: 08-send
- runFlow: subflows/back.yaml
# Deep link (app.json scheme): this step checks the Activity screen itself.
- openLink: nexub://patterns/activity
# iOS asks "Open in Nexub Mobile?" the first time a link opens the app.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Amazon.*"
    timeout: 10000
- takeScreenshot: 09-activity

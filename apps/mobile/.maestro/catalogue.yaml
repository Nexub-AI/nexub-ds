# Walks every catalogue screen and screenshots it (iOS + Android in CI).
# Scroll targets into view with subflows/scroll-to.yaml (centred on Android,
# where a row at the bottom edge sits under the gesture bar; not on iOS, where
# centring can park it under the translucent navigation bar). Taps retry if
# the screen didn't change (a tap that only stops scroll momentum on iOS).
# List rows are one accessible element ("Title, subtitle"), so match by prefix.
# Toasts, dialogs and sheets spring in, so wait for them rather than assert
# at the instant of the tap (iOS simulators run the animation; CI Android
# emulators have system animations off).
appId: ai.nexub.mobile
---
# CI installs a fresh build, so no clearState (it reinstalls on iOS and can hang).
- launchApp
- extendedWaitUntil:
    visible: "Components"
    timeout: 60000
# On a slow cold launch the home screen keeps settling after "Components"
# appears. A tap then is lost, and retryTapIfNoChange sees the settling as the
# tap's effect, so it doesn't retry. Let it settle, and retry the first
# navigation once.
- waitForAnimationToEnd
- takeScreenshot: 00-catalogue

- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: "Foundations.*"
          retryTapIfNoChange: true
      - extendedWaitUntil:
          visible: "Display"
          timeout: 10000
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Press me"
- tapOn:
    text: "Press me"
    retryTapIfNoChange: true
- takeScreenshot: 01-foundations
- runFlow: subflows/back.yaml

- tapOn:
    text: "Actions.*"
    retryTapIfNoChange: true
- runFlow:
    file: subflows/wait-for.yaml
    env:
      TEXT: "Continue"
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Bank"
- tapOn:
    text: "Bank"
    retryTapIfNoChange: true
- takeScreenshot: 02-actions
- runFlow: subflows/back.yaml

- tapOn:
    text: "Inputs.*"
    retryTapIfNoChange: true
- runFlow:
    file: subflows/wait-for.yaml
    env:
      TEXT: "You send"
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Month"
- tapOn:
    text: "Month"
    retryTapIfNoChange: true
- takeScreenshot: 03-inputs
- runFlow: subflows/back.yaml

- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Lists & cards.*"
- tapOn:
    text: "Lists & cards.*"
    retryTapIfNoChange: true
- runFlow:
    file: subflows/wait-for.yaml
    env:
      TEXT: "Total balance"
- takeScreenshot: 04-lists
- runFlow: subflows/back.yaml

- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Feedback.*"
- tapOn:
    text: "Feedback.*"
    retryTapIfNoChange: true
- runFlow:
    file: subflows/wait-for.yaml
    env:
      TEXT: "Banners"
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Show toast"
- tapOn:
    text: "Show toast"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Recipient saved"
    timeout: 5000
- takeScreenshot: 05-feedback
- tapOn:
    text: "Open dialog"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Cancel this transfer?"
    timeout: 5000
- tapOn:
    text: "Keep it"
    retryTapIfNoChange: true
- assertNotVisible: "Cancel this transfer?"
- runFlow: subflows/back.yaml

- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Mobile patterns.*"
- tapOn:
    text: "Mobile patterns.*"
    retryTapIfNoChange: true
- runFlow:
    file: subflows/wait-for.yaml
    env:
      TEXT: "Sheets and menus"
- tapOn:
    text: "Open sheet"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Transfer details"
    timeout: 5000
- takeScreenshot: 06-sheet
- tapOn:
    text: "Confirm and send"
    retryTapIfNoChange: true
- assertNotVisible: "Transfer details"
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Show Balance"
- tapOn:
    text: "Show Balance"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: ".*12,480.50"
    timeout: 5000
- takeScreenshot: 07-mobile
- runFlow: subflows/back.yaml

- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Screens.*"
- tapOn:
    text: "Screens.*"
    retryTapIfNoChange: true
- runFlow:
    file: subflows/wait-for.yaml
    env:
      TEXT: "Payub flows"
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Send money.*"
- tapOn:
    text: "Send money.*"
    retryTapIfNoChange: true
- runFlow:
    file: subflows/wait-for.yaml
    env:
      TEXT: "How much?"
- tapOn:
    text: "2"
    retryTapIfNoChange: true
- tapOn:
    text: "5"
    retryTapIfNoChange: true
- tapOn:
    text: "0"
    retryTapIfNoChange: true
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: "Recipient gets.*"
- takeScreenshot: 08-send
- runFlow: subflows/back.yaml
# Back on the Payub flows list: open Activity from it. (Deep links are covered
# by previews/; on the iOS simulator a link sent while the app is open
# sometimes never navigates.) Scroll up to the section header, not to the row:
# after the back swipe the row can sit just under the translucent navigation
# bar, where "fully visible" still holds but a tap only highlights it.
- scrollUntilVisible:
    element: "Payub flows"
    direction: UP
- tapOn:
    text: "Activity.*"
    retryTapIfNoChange: true
- runFlow:
    file: subflows/wait-for.yaml
    env:
      TEXT: "Amazon.*"
- takeScreenshot: 09-activity

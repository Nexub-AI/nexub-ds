# Walks every catalogue screen and screenshots it (iOS + Android in CI).
# Scroll to each target first: CI emulators have small screens.
appId: ai.nexub.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Components"
    timeout: 60000
- takeScreenshot: 00-catalogue

- tapOn: "Foundations"
- extendedWaitUntil:
    visible: "Display"
    timeout: 10000
- scrollUntilVisible:
    element: "Press me"
- tapOn: "Press me"
- takeScreenshot: 01-foundations
- back

- tapOn: "Actions"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 10000
- scrollUntilVisible:
    element: "Bank"
- tapOn: "Bank"
- takeScreenshot: 02-actions
- back

- tapOn: "Inputs"
- extendedWaitUntil:
    visible: "You send"
    timeout: 10000
- scrollUntilVisible:
    element: "Month"
- tapOn: "Month"
- takeScreenshot: 03-inputs
- back

- scrollUntilVisible:
    element: "Lists & cards"
- tapOn: "Lists & cards"
- extendedWaitUntil:
    visible: "Total balance"
    timeout: 10000
- takeScreenshot: 04-lists
- back

- scrollUntilVisible:
    element: "Feedback"
- tapOn: "Feedback"
- extendedWaitUntil:
    visible: "Banners"
    timeout: 10000
- scrollUntilVisible:
    element: "Show toast"
- tapOn: "Show toast"
- assertVisible: "Recipient saved"
- takeScreenshot: 05-feedback
- tapOn: "Open dialog"
- assertVisible: "Cancel this transfer?"
- tapOn: "Keep it"
- assertNotVisible: "Cancel this transfer?"
- back

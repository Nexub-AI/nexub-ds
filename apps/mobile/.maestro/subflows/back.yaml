# Back one screen. Maestro's `back` is Android's Back key; iOS uses the
# native-stack edge swipe.
appId: ai.nexub.mobile
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 1%, 50%
          end: 90%, 50%
          duration: 400
- waitForAnimationToEnd

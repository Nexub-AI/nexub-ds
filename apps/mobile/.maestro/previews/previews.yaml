- extendedWaitUntil:
    visible: "Components"
    timeout: 60000
- waitForAnimationToEnd
- retry:
    maxRetries: 1
    commands:
      - openLink: nexub://preview/text?ex=0
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Open"
